<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteTrace — Client Report</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px; color: #1a1a2e; background: #f8fafc; line-height: 1.5; }

  /* Top bar */
  .topbar { background: #1a1a2e; color: #fff; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-brand { display: flex; align-items: center; gap: 10px; }
  .topbar-mark { width: 32px; height: 32px; background: #6366f1; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .topbar-mark svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
  .topbar-name { font-size: 1.1rem; font-weight: 800; letter-spacing: -.02em; }
  .topbar-tag { font-size: .72rem; color: #a5b4fc; }
  .topbar-meta { text-align: right; font-size: .75rem; color: #94a3b8; line-height: 1.6; }
  .topbar-url { color: #a5b4fc; font-weight: 600; }

  /* Hero */
  .hero { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%); color: #fff; padding: 48px 32px 40px; }
  .hero-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 32px; flex-wrap: wrap; }
  .hero-left h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -.03em; margin-bottom: 6px; }
  .hero-left p { color: #94a3b8; font-size: .9rem; margin-bottom: 16px; }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 5px 14px; border-radius: 20px; }
  .status-pill.online  { background: rgba(22,163,74,.15); color: #4ade80; border: 1px solid rgba(74,222,128,.3); }
  .status-pill.down    { background: rgba(220,38,38,.15); color: #f87171; border: 1px solid rgba(248,113,113,.3); }
  .status-pill.warning { background: rgba(217,119,6,.15); color: #fbbf24; border: 1px solid rgba(251,191,36,.3); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .hero-score { text-align: center; }
  .score-ring { width: 100px; height: 100px; margin: 0 auto 8px; }
  .score-label { font-size: .72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: .08em; }

  /* Metric cards */
  .metrics { max-width: 900px; margin: -24px auto 0; padding: 0 32px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; position: relative; z-index: 10; }
  .metric-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .metric-label { font-size: .68rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .metric-value { font-size: 1.6rem; font-weight: 800; line-height: 1; }
  .metric-sub { font-size: .72rem; color: #94a3b8; margin-top: 4px; }

  /* Content */
  .content { max-width: 900px; margin: 32px auto; padding: 0 32px 64px; }
  section { margin-bottom: 32px; }
  .section-head { font-size: .65rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #94a3b8; padding-bottom: 10px; border-bottom: 1px solid #e2e8f0; margin-bottom: 16px; }

  /* Uptime chart */
  .uptime-bar-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .uptime-bar-track { flex: 1; height: 8px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
  .uptime-bar-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
  .uptime-pct { font-size: .85rem; font-weight: 700; width: 48px; text-align: right; }
  .uptime-dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
  .uptime-dot { width: 12px; height: 24px; border-radius: 3px; cursor: default; }

  /* Issues */
  .issue-list { border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
  .issue-row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #f1f5f9; background: #fff; }
  .issue-row:last-child { border-bottom: none; }
  .issue-badge { flex-shrink: 0; font-size: .65rem; font-weight: 800; padding: 3px 9px; border-radius: 5px; margin-top: 1px; text-transform: uppercase; letter-spacing: .04em; }
  .issue-badge.fail    { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .issue-badge.warn    { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
  .issue-badge.warning { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
  .issue-body { flex: 1; }
  .issue-title { font-weight: 600; font-size: .9rem; margin-bottom: 2px; }
  .issue-desc  { font-size: .78rem; color: #64748b; line-height: 1.5; }
  .issue-fix   { font-size: .78rem; color: #475569; margin-top: 3px; line-height: 1.5; }
  .issue-fix strong { color: #1a1a2e; }
  .issue-value { flex-shrink: 0; font-size: .72rem; font-weight: 700; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 5px; padding: 3px 8px; white-space: nowrap; }
  .empty-state { padding: 24px; text-align: center; color: #94a3b8; font-size: .85rem; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; }
  .empty-state span { font-size: 1.5rem; display: block; margin-bottom: 6px; }

  /* Incidents */
  .incident-row { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .incident-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .incident-dot { width: 8px; height: 8px; border-radius: 50%; background: #dc2626; flex-shrink: 0; }
  .incident-title { font-weight: 600; font-size: .9rem; flex: 1; }
  .incident-time { font-size: .72rem; color: #94a3b8; }
  .incident-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: .72rem; font-weight: 600; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 5px; padding: 2px 8px; }
  .chip.resolved { background: #f0fdf4; border-color: #bbf7d0; color: #16a34a; }

  /* Checks table */
  .checks-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
  .checks-table th { background: #f8fafc; font-size: .65rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #64748b; padding: 10px 14px; text-align: left; border-bottom: 2px solid #e2e8f0; }
  .checks-table td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; font-size: .82rem; }
  .checks-table tr:last-child td { border-bottom: none; }
  .td-badge { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 5px; }
  .td-badge.online  { background: #f0fdf4; color: #16a34a; }
  .td-badge.down    { background: #fef2f2; color: #dc2626; }
  .td-badge.warning { background: #fffbeb; color: #d97706; }

  /* Scan breakdown */
  .cat-block { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
  .cat-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid #f1f5f9; background: #f8fafc; }
  .check-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #f8fafc; }
  .check-row:last-child { border-bottom: none; }
  .check-icon { flex-shrink: 0; width: 15px; height: 15px; margin-top: 1px; }
  .check-body { flex: 1; }
  .check-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .check-title { font-size: .85rem; font-weight: 500; }
  .check-val { font-size: .7rem; font-weight: 700; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 4px; padding: 1px 7px; }
  .check-desc { margin-top: 3px; font-size: .76rem; color: #64748b; line-height: 1.4; }
  .check-fix { margin-top: 2px; font-size: .76rem; color: #475569; }
  .lvl-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .lvl-dot.pass { background: #16a34a; }
  .lvl-dot.fail { background: #dc2626; }
  .lvl-dot.warn, .lvl-dot.warning { background: #d97706; }

  /* Footer */
  .report-footer { max-width: 900px; margin: 0 auto; padding: 24px 32px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; font-size: .75rem; color: #94a3b8; }
  .footer-brand { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #6366f1; font-size: .82rem; }

  /* Loading / error */
  .full-center { min-height: 60vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: #64748b; }
  .spinner { width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #6366f1; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 680px) {
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .hero-inner { flex-direction: column; }
    .hero-score { align-self: flex-start; }
    .topbar { flex-direction: column; gap: 8px; align-items: flex-start; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="full-center">
    <div class="spinner"></div>
    <p>Loading report…</p>
  </div>
</div>

<script>
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(dt) {
  if (!dt) return '–';
  const d = new Date(dt);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' +
         d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
function fmtDate(dt) {
  if (!dt) return '–';
  return new Date(dt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function statusLabel(s) {
  if (s === 'up' || s === 'online') return 'online';
  if (s === 'down') return 'down';
  return 'warning';
}

const slug = location.pathname.split('/').pop();

fetch('/public/report/' + encodeURIComponent(slug))
  .then(r => r.json())
  .then(data => {
    if (data.status !== 'success') {
      document.getElementById('app').innerHTML = `<div class="full-center"><span style="font-size:2rem">🔍</span><p>Report not found or not public.</p></div>`;
      return;
    }
    render(data.site, data.checks || [], data.incidents || []);
  })
  .catch(() => {
    document.getElementById('app').innerHTML = `<div class="full-center"><p>Could not load report. Please try again.</p></div>`;
  });

function render(site, checks, incidents) {
  const st = statusLabel(site.last_status);
  const score = site.last_score || 0;
  const scoreColor = score >= 80 ? '#16a34a' : score >= 60 ? '#d97706' : '#dc2626';
  const scoreBg = score >= 80 ? '#f0fdf4' : score >= 60 ? '#fffbeb' : '#fef2f2';

  // Stats
  const upChecks = checks.filter(c => statusLabel(c.status) !== 'down').length;
  const upPct = checks.length ? ((upChecks / checks.length) * 100).toFixed(1) : null;
  const respChecks = checks.filter(c => Number(c.response_time_ms) > 0);
  const avgResp = respChecks.length ? Math.round(respChecks.reduce((s,c) => s + Number(c.response_time_ms), 0) / respChecks.length) : null;

  // Latest scan checks
  const latest = checks[0] || {};
  const latestResult = latest.result || {};
  const allChecks = Array.isArray(latestResult.checks) ? latestResult.checks : [];
  const issues = allChecks.filter(c => c.level !== 'pass');

  // Category grouping
  const catIcon = { domain:'🌐', ssl:'🔒', seo:'🔍', uptime:'📡', performance:'⚡', keyword:'👁' };
  const catLabel = { domain:'Domain', ssl:'SSL Certificate', seo:'SEO', uptime:'Uptime & Status', performance:'Performance', keyword:'Keyword Monitor' };
  const levelOrder = { fail:0, warn:1, warning:1, pass:2 };
  const byCategory = {};
  allChecks.forEach(c => {
    const cat = c.category || 'other';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(c);
  });
  const sortedCats = Object.keys(byCategory).sort((a,b) => {
    const worst = arr => Math.min(...arr.map(c => levelOrder[c.level] ?? 2));
    return worst(byCategory[a]) - worst(byCategory[b]);
  });
  const catColors = { fail:'#dc2626', warn:'#d97706', warning:'#d97706', pass:'#16a34a' };

  // SVG score ring
  const r = 38, cx = 50, cy = 50, circ = 2 * Math.PI * r;
  const dashOffset = circ - (score / 100) * circ;
  const scoreRingSvg = `<svg class="score-ring" viewBox="0 0 100 100">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="8"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${scoreColor}" stroke-width="8"
      stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${dashOffset.toFixed(1)}"
      stroke-linecap="round" transform="rotate(-90 50 50)"/>
    <text x="50" y="45" text-anchor="middle" font-size="18" font-weight="800" fill="${scoreColor}" font-family="Arial">${score}</text>
    <text x="50" y="62" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="Arial">/100</text>
  </svg>`;

  // Uptime dots (last 30 checks)
  const dotHtml = checks.slice(0, 30).reverse().map(c => {
    const s = statusLabel(c.status);
    const col = s === 'online' ? '#16a34a' : s === 'down' ? '#dc2626' : '#f59e0b';
    return `<div class="uptime-dot" style="background:${col};" title="${esc(fmt(c.created_at))} — ${s}"></div>`;
  }).join('');

  // Issues HTML
  const issuesHtml = issues.length ? issues.map(c => {
    const isIssue = c.level === 'fail' || c.level === 'warn' || c.level === 'warning';
    return `<div class="issue-row">
      <span class="issue-badge ${c.level}">${esc(c.level)}</span>
      <div class="issue-body">
        <div class="issue-title">${esc(c.title)}</div>
        ${c.description ? `<div class="issue-desc">${esc(c.description)}</div>` : ''}
        ${c.recommendation && isIssue ? `<div class="issue-fix"><strong>Fix:</strong> ${esc(c.recommendation)}</div>` : ''}
      </div>
      ${c.value ? `<span class="issue-value">${esc(c.value)}</span>` : ''}
    </div>`;
  }).join('') : `<div class="empty-state"><span>✅</span>No issues found in the latest scan.</div>`;

  // Incidents HTML
  const incidentsHtml = incidents.length ? incidents.map(inc => {
    const resolved = inc.status === 'resolved' || !!inc.resolved_at;
    const dur = inc.duration_seconds ? Math.round(inc.duration_seconds / 60) + 'm' : null;
    return `<div class="incident-row">
      <div class="incident-top">
        <div class="incident-dot" style="background:${resolved ? '#16a34a' : '#dc2626'};"></div>
        <span class="incident-title">${esc(inc.title || 'Downtime detected')}</span>
        <span class="incident-time">${fmt(inc.created_at)}</span>
      </div>
      <div class="incident-chips">
        <span class="chip ${resolved ? 'resolved' : ''}">${resolved ? '✓ Resolved' : '⚠ Active'}</span>
        ${dur ? `<span class="chip">Duration: ${dur}</span>` : ''}
        ${inc.resolved_at ? `<span class="chip">Resolved: ${fmtDate(inc.resolved_at)}</span>` : ''}
      </div>
    </div>`;
  }).join('') : `<div class="empty-state"><span>🎉</span>No incidents recorded.</div>`;

  // Checks table HTML
  const checksHtml = checks.slice(0, 20).map(c => {
    const s = statusLabel(c.status);
    return `<tr>
      <td>${fmt(c.created_at)}</td>
      <td><span class="td-badge ${s}">${s}</span></td>
      <td>${c.score ? c.score + '/100' : '–'}</td>
      <td>${c.response_time_ms ? c.response_time_ms + 'ms' : '–'}</td>
      <td>${c.status_code || '–'}</td>
    </tr>`;
  }).join('');

  // Scan breakdown HTML
  const breakdownHtml = sortedCats.map(cat => {
    const catChecks = byCategory[cat].slice().sort((a,b) => (levelOrder[a.level]??2)-(levelOrder[b.level]??2));
    const worst = catChecks[0]?.level || 'pass';
    const worstColor = catColors[worst] || '#64748b';
    return `<div class="cat-block">
      <div class="cat-head" style="color:${worstColor};">
        ${catIcon[cat] || '📋'} ${catLabel[cat] || cat}
      </div>
      ${catChecks.map(c => {
        const isIssue = c.level === 'fail' || c.level === 'warn' || c.level === 'warning';
        const iconSvg = c.level === 'pass'
          ? `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`
          : c.level === 'fail'
          ? `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`
          : `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
        return `<div class="check-row">
          ${iconSvg}
          <div class="check-body">
            <div class="check-top">
              <span class="check-title">${esc(c.title)}</span>
              ${c.value ? `<span class="check-val">${esc(c.value)}</span>` : ''}
            </div>
            ${c.description ? `<div class="check-desc">${esc(c.description)}</div>` : ''}
            ${c.recommendation && isIssue ? `<div class="check-fix"><strong>Fix:</strong> ${esc(c.recommendation)}</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  const generated = new Date().toLocaleString(undefined, { dateStyle: 'long', timeStyle: 'short' });

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="topbar-brand">
        <div class="topbar-mark">
          <svg viewBox="0 0 24 24"><path d="M4 12h3l2-7 4 14 2-7h5"/></svg>
        </div>
        <div>
          <div class="topbar-name">SiteTrace</div>
          <div class="topbar-tag">Website Health Report</div>
        </div>
      </div>
      <div class="topbar-meta">
        <span class="topbar-url">${esc(site.url)}</span><br>
        Generated ${generated}
      </div>
    </div>

    <div class="hero">
      <div class="hero-inner">
        <div class="hero-left">
          <h1>${esc(site.name)}</h1>
          <p>${esc(site.url)}</p>
          <span class="status-pill ${st}">
            <span class="status-dot"></span>
            ${st === 'online' ? 'Healthy Right Now' : st === 'down' ? 'Currently Down' : 'Warning Detected'}
          </span>
        </div>
        <div class="hero-score">
          ${scoreRingSvg}
          <div class="score-label">Health Score</div>
        </div>
      </div>
    </div>

    <div class="metrics">
      <div class="metric-card">
        <div class="metric-label">Health Score</div>
        <div class="metric-value" style="color:${scoreColor};">${score}<span style="font-size:1rem;color:#94a3b8;">/100</span></div>
        <div class="metric-sub">${score >= 80 ? 'Great shape' : score >= 60 ? 'Needs attention' : 'Critical issues'}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Uptime Sample</div>
        <div class="metric-value" style="color:${upPct >= 99 ? '#16a34a' : upPct >= 95 ? '#d97706' : '#dc2626'};">${upPct != null ? upPct + '%' : '–'}</div>
        <div class="metric-sub">${checks.length} checks reviewed</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Avg Response</div>
        <div class="metric-value" style="color:${avgResp < 400 ? '#16a34a' : avgResp < 800 ? '#d97706' : '#dc2626'};">${avgResp != null ? avgResp + 'ms' : '–'}</div>
        <div class="metric-sub">${avgResp < 400 ? 'Fast' : avgResp < 800 ? 'Acceptable' : 'Slow'}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Open Issues</div>
        <div class="metric-value" style="color:${issues.length === 0 ? '#16a34a' : issues.some(i=>i.level==='fail') ? '#dc2626' : '#d97706'};">${issues.length}</div>
        <div class="metric-sub">${issues.length === 0 ? 'All clear' : issues.filter(i=>i.level==='fail').length + ' critical'}</div>
      </div>
    </div>

    <div class="content">

      ${checks.length ? `
      <section>
        <div class="section-head">Uptime — last ${Math.min(checks.length,30)} checks</div>
        <div class="uptime-bar-wrap">
          <div class="uptime-bar-track">
            <div class="uptime-bar-fill" style="width:${upPct}%;background:${upPct >= 99 ? '#16a34a' : upPct >= 95 ? '#d97706' : '#dc2626'};"></div>
          </div>
          <span class="uptime-pct" style="color:${upPct >= 99 ? '#16a34a' : '#d97706'};">${upPct}%</span>
        </div>
        <div class="uptime-dots">${dotHtml}</div>
      </section>` : ''}

      <section>
        <div class="section-head">Issues Found — ${issues.length || 'None'}</div>
        <div class="issue-list">${issuesHtml}</div>
      </section>

      <section>
        <div class="section-head">Recent Incidents</div>
        ${incidentsHtml}
      </section>

      <section>
        <div class="section-head">Recent Checks</div>
        <table class="checks-table">
          <thead><tr><th>Time</th><th>Status</th><th>Score</th><th>Response</th><th>HTTP</th></tr></thead>
          <tbody>${checksHtml || '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px;">No checks yet.</td></tr>'}</tbody>
        </table>
      </section>

      ${allChecks.length ? `
      <section>
        <div class="section-head">Full Scan Breakdown — ${allChecks.length} checks · ${fmt(latest.created_at)}</div>
        ${breakdownHtml}
      </section>` : ''}

    </div>

    <div class="report-footer">
      <div class="footer-brand">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:#6366f1;stroke-width:2;stroke-linecap:round;"><path d="M4 12h3l2-7 4 14 2-7h5"/></svg>
        SiteTrace
      </div>
      <span>Generated ${generated} · ${esc(site.url)}</span>
    </div>
  `;
}
</script>
</body>
</html>
