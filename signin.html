<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - SiteTrace</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-page="signin">
  <nav class="nav">
    <div class="container nav-inner">
      <a class="brand" href="/"><span class="brand-mark">ST</span><span>SiteTrace</span></a>
      <div class="nav-links">
        <a href="/pricing">Pricing</a>
        <a href="/demo">Demo</a>
        <a href="/api">How it works</a>
        <a href="/dashboard">Dashboard</a>
      </div>
    </div>
  </nav>
  <main class="auth-page">
    <div class="container auth-layout">
      <section class="auth-copy">
        <p class="eyebrow">Customer access</p>
        <h1>Sign in to manage monitored sites.</h1>
        <p class="lead">Create an account to save sites, run checks, and keep history separate from the public scanner.</p>
      </section>
      <form id="authForm" class="feature auth-form">
        <h2>Sign in or create account</h2>
        <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="Password" required>
        <button class="button" type="submit">Sign in</button>
        <button class="button secondary" id="signUpBtn" type="button">Create account</button>
        <p class="muted" id="authMessage"></p>
      </form>
    </div>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
